
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Appointment System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🏥 MediCare Hospital</h1>
    <p>Your Health, Our Priority</p>
</header>

<nav>
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('register')">Register</button>
    <button onclick="showSection('login')">Login</button>
    <button onclick="showSection('doctors')">Doctors</button>
    <button onclick="showSection('appointments')">My Appointments</button>
    <button onclick="showSection('admin')">Admin</button>
    <button onclick="logout()">Logout</button>
</nav>

<main>

<section id="home" class="section active">
    <h2>Welcome to MediCare Hospital</h2>
    <p>Book appointments with experienced doctors easily.</p>
    <button onclick="showSection('doctors')">Find Doctors</button>
</section>

<section id="register" class="section">
    <h2>Patient Registration</h2>
    <form id="registerForm">
        <input id="regName" placeholder="Full Name" required>
        <input id="regEmail" type="email" placeholder="Email" required>
        <input id="regPassword" type="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>
    <p id="registerMessage"></p>
</section>

<section id="login" class="section">
    <h2>Patient / Admin Login</h2>
    <form id="loginForm">
        <input id="loginEmail" type="email" placeholder="Email" required>
        <input id="loginPassword" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p id="loginMessage"></p>
</section>

<section id="doctors" class="section">
    <h2>Our Doctors</h2>
    <input id="specialization" placeholder="Search by specialization">
    <button onclick="loadDoctors()">Search</button>
    <div id="doctorList"></div>
</section>

<section id="appointments" class="section">
    <h2>My Appointments</h2>
    <div id="appointmentList"></div>
</section>

<section id="admin" class="section">
    <h2>Admin Dashboard</h2>
    <button onclick="loadAdminAppointments()">View All Appointments</button>
    <div id="adminList"></div>
</section>

</main>

<footer>
    <p>© 2026 MediCare Hospital | All Rights Reserved</p>
</footer>

<script src="script.js"></script>
</body>
</html>
